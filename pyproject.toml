[build-system]
requires = ["PyYAML>=6,<7"]
build-backend = "oh_package"
backend-path = ["lib"]

[project]
name = "thermite-app"
dynamic = ["version"]
description = "Thermite house configuration and control application"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
license = {text = "All rights reserved"}

[project.scripts]
thermite = "thermite_app:main"

# Static checks (`make check-static`; requirements-static.txt pins the
# tools). Both keep what they write under .scratch/, which git ignores.
[tool.ruff]
target-version = "py311"
cache-dir = ".scratch/ruff"
# The launcher is Python without the suffix.
extend-include = ["bin/thermite"]

[tool.ruff.lint]
# A family is here for a class of defect it holds in this code, not for
# style: a line may be long, and a statement may follow its colon.
select = [
    # Names: an import or a variable nothing reads, a name bound twice
    # before it is read, an f-string with nothing to fill in.
    "F",
    # A file that does not parse.
    "E9",
    # Among pylint's errors: a character that reorders the text beside it.
    "PLE",
    # zip() that drops the tail of the longer of two lists without saying
    # so (strict= says which is meant), a function made in a loop that reads
    # the loop's variable after the loop has moved on, an error raised
    # while another is handled without saying whether that one caused it.
    "B",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "lib"
explicit_package_bases = true
cache_dir = ".scratch/mypy"
# Only the modules under `files` are reported; what they import is read for
# its types and not reported.
follow_imports = "silent"
# Most functions here have no annotations, and their bodies are checked
# all the same: that is where a misspelt key of a Device is.
check_untyped_defs = true
# A `type: ignore` names its error and is removed when it ignores nothing.
enable_error_code = ["ignore-without-code"]
warn_unused_ignores = true
# The checked modules: every module that passes as it stands, the house's
# shape, model and reader (oh_shape, oh_inventory, oh_conf) among them. A
# module joins when it passes; one that is here stays clean.
