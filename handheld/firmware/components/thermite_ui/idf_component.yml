# The only external component (design/handheld-remote.md, Decisions), pinned
# exactly. Public: thermite_ui.h includes lvgl.h, so the remote app reaches
# LVGL through thermite_ui. remote/dependencies.lock records its hash;
# host/fetch-deps.sh fetches the same release for the host build.
dependencies:
  idf: ">=5.5.6"
  lvgl/lvgl:
    version: "9.2.2"
    require: public
