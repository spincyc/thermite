<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>thermite · Music</title>
  <meta name="description" content="thermite: TIDAL and the house's music library on the Sonos and WiiM speakers, alone or grouped.">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="thermite">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#120e0c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="remote.css">
  <link rel="stylesheet" href="music.css">
  <link rel="stylesheet" href="shell.css">
  <script src="navigation.js"></script><script src="appearance.js"></script><script src="access-config.js"></script><script src="access.js"></script>
  <script src="shell.js" defer></script>
  <script src="music-backend.js" defer></script>
  <script src="music-session.js" defer></script>
  <script src="music.js" defer></script>
</head>
<body class="music-page" data-thermite-page="music">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 13.5 4.5 9 9 4.5"/><path d="M4.5 9h10a5 5 0 0 1 0 10H11"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="3.2"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path d="M18 6.5v11l-8.5-5.5z" fill="currentColor"/><path d="M6.5 6.5v11"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.5v11l8.5-5.5z" fill="currentColor"/><path d="M17.5 6.5v11"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c2 0 3.2 1 4.3 2.7l1.4 2.6c1.1 1.7 2.3 2.7 4.3 2.7H20"/><path d="M4 17h3c1.4 0 2.4-.5 3.2-1.4M13.8 8.4c.8-.9 1.8-1.4 3.2-1.4H20"/><path d="m17.5 4.5 2.5 2.5-2.5 2.5M17.5 14.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4.5 11V9.5a3 3 0 0 1 3-3h11"/><path d="m16 4 2.5 2.5L16 9"/><path d="M19.5 13v1.5a3 3 0 0 1-3 3h-11"/><path d="m8 20-2.5-2.5L8 15"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M4.5 11V9.5a3 3 0 0 1 3-3h11"/><path d="m16 4 2.5 2.5L16 9"/><path d="M19.5 13v1.5a3 3 0 0 1-3 3h-11"/><path d="m8 20-2.5-2.5L8 15"/><path d="m11 10.5 1.5-1v5"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><rect x="3.5" y="5" width="7.5" height="14" rx="2"/><rect x="13" y="5" width="7.5" height="14" rx="2"/><circle cx="7.25" cy="14" r="2"/><circle cx="16.75" cy="14" r="2"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-artist" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6.5h11M4 11.5h11M4 16.5h6"/><path d="M17.5 18.5v-7l3-1"/><circle cx="15.5" cy="18.5" r="2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
  </svg>

  <main class="music" aria-labelledby="music-title">
    <header class="music__head" data-thermite-bar-host>
      <a class="music__back" href="./">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back"></use></svg>
        <span>Remotes</span>
      </a>
      <h1 class="sr-only" id="music-title">Music</h1>
      <!-- The shell lends the bar this switch on a phone or tablet, as Remotes does its room switch. -->
      <button class="room-switch music__switch" type="button" data-thermite-bar="title" aria-haspopup="dialog" aria-controls="speaker-sheet" data-switch>
        <span class="room-switch__name"><span data-switch-name>Speakers</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-down"></use></svg></span>
      </button>
    </header>

    <p class="music__mock" data-mock hidden>Demo · invented speakers and music. Nothing plays.</p>

    <p class="alert music__alert" data-alert hidden>
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-warn"></use></svg>
      <span data-alert-text></span>
    </p>

    <div class="music__layout" data-layout hidden>
      <section class="music__speakers" aria-labelledby="music-speakers-title" data-speakers-panel>
        <h2 class="panel__title" id="music-speakers-title">Speakers</h2>
        <ul class="rooms music-speakers" data-speakers></ul>
      </section>

      <section class="music__now" aria-labelledby="music-now-name" data-now-panel hidden>
        <h2 class="sr-only" id="music-now-name" data-now-name></h2>
        <!-- A locked room that has a speaker here disables its controls; the gateway refuses them anyway. -->
        <fieldset class="music__controls" data-controls>
          <legend class="sr-only">Controls</legend>
          <div class="now-card music-now" data-now>
            <div class="music-now__head">
              <div class="music-art" data-art>
                <img class="music-art__image" alt="" width="96" height="96" decoding="async" data-art-image hidden>
                <svg class="icon music-art__note" aria-hidden="true" focusable="false"><use href="#i-note"></use></svg>
              </div>
              <div class="music-now__text">
                <p class="now-card__place"><span data-place></span><span class="now-card__model" data-model></span></p>
                <p class="now-card__title" data-title></p>
                <p class="now-card__line" data-line></p>
                <p class="music-now__queue" data-queue-of hidden></p>
              </div>
            </div>
            <div class="music-progress" data-progress hidden>
              <span class="music-progress__time" data-elapsed aria-hidden="true">0:00</span>
              <input class="music-progress__input" type="range" min="0" max="1" step="1" value="0" aria-label="Position" data-seek>
              <span class="music-progress__time" data-duration aria-hidden="true"></span>
            </div>
            <div class="now-card__transport music-transport" role="group" aria-label="Playback">
              <button class="key key--toggle music-key" type="button" aria-pressed="false" aria-label="Shuffle" aria-keyshortcuts="S" data-shuffle>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-shuffle"></use></svg>
              </button>
              <button class="key key--sm" type="button" aria-label="Previous track" data-previous>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-previous"></use></svg>
              </button>
              <button class="key key--play" type="button" aria-label="Play" aria-keyshortcuts="P" data-play>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg>
              </button>
              <button class="key key--sm" type="button" aria-label="Next track" data-next>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-next"></use></svg>
              </button>
              <button class="key key--toggle music-key" type="button" aria-pressed="false" aria-label="Repeat off" aria-keyshortcuts="R" data-repeat>
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-repeat"></use></svg>
              </button>
            </div>
          </div>

          <div class="music__volume" data-volume-wrap>
            <div class="fader">
              <div class="fader__bar">
                <button class="fader__step" type="button" data-volume-step="-1" aria-label="Volume down">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"></use></svg>
                </button>
                <input class="fader__input" type="range" min="0" max="100" step="1" value="0" aria-label="Volume" data-volume>
                <button class="fader__step" type="button" data-volume-step="1" aria-label="Volume up">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="music__level" data-volume-text aria-hidden="true"></p>

          <div class="music-group" data-group>
            <svg class="icon music-group__icon" aria-hidden="true" focusable="false"><use href="#i-group"></use></svg>
            <p class="music-group__text" data-group-text>Not grouped</p>
            <button class="button music-group__open" type="button" aria-haspopup="dialog" aria-controls="group-sheet" data-group-open>Group</button>
          </div>
          <div class="music__volume" data-group-volume-wrap hidden>
            <div class="fader">
              <div class="fader__bar">
                <button class="fader__step" type="button" data-group-step="-1" aria-label="Group volume down">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"></use></svg>
                </button>
                <input class="fader__input" type="range" min="0" max="100" step="1" value="0" aria-label="Group volume" data-group-volume>
                <button class="fader__step" type="button" data-group-step="1" aria-label="Group volume up">
                  <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="music__level" data-group-volume-text aria-hidden="true" hidden></p>
        </fieldset>
      </section>

      <section class="music__library" aria-labelledby="music-library-title" data-library hidden>
        <h2 class="sr-only" id="music-library-title">Library</h2>

        <div class="music-tidal" data-tidal hidden>
          <div class="music-tidal__text">
            <p class="music-tidal__title" data-tidal-text></p>
            <p class="music-tidal__code" data-tidal-code hidden></p>
          </div>
          <div class="music-tidal__actions">
            <a class="button music-tidal__link" target="_blank" rel="noopener noreferrer" data-tidal-link hidden>Open link.tidal.com</a>
            <button class="button" type="button" data-tidal-start>Sign in to TIDAL</button>
            <button class="button" type="button" data-tidal-cancel hidden>Cancel</button>
          </div>
        </div>

        <div class="segmented music-tabs" role="tablist" aria-label="Library" data-tabs>
          <button class="segmented__option" type="button" role="tab" id="music-tab-search" aria-controls="music-panel-search" data-tab="search">Search</button>
          <button class="segmented__option" type="button" role="tab" id="music-tab-browse" aria-controls="music-panel-browse" data-tab="browse">Browse</button>
          <button class="segmented__option" type="button" role="tab" id="music-tab-queue" aria-controls="music-panel-queue" data-tab="queue">Queue</button>
        </div>

        <p class="music__note" data-blind hidden></p>

        <div class="music-panel" role="tabpanel" id="music-panel-search" aria-labelledby="music-tab-search" data-panel="search" hidden>
          <form class="music-search" role="search" data-search-form>
            <input class="music-search__input" type="search" name="q" maxlength="100" autocomplete="off" enterkeyhint="search"
              placeholder="Artists, albums, tracks" aria-label="Search music" aria-keyshortcuts="/" data-query>
            <div class="music-search__filters">
              <select class="setting__select music-search__select" aria-label="Kind" data-kind></select>
              <select class="setting__select music-search__select" aria-label="Source" data-source></select>
            </div>
          </form>
          <p class="music__note" data-search-text></p>
          <div data-results></div>
        </div>

        <div class="music-panel" role="tabpanel" id="music-panel-browse" aria-labelledby="music-tab-browse" data-panel="browse" hidden>
          <div class="music-path">
            <button class="icon-button" type="button" aria-label="Back" data-browse-back>
              <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back"></use></svg>
            </button>
            <p class="music-path__text" data-browse-path></p>
          </div>
          <p class="music__note" data-browse-text></p>
          <ul class="music-items" data-browse-items></ul>
          <button class="button music__more" type="button" data-more hidden>More</button>
        </div>

        <div class="music-panel" role="tabpanel" id="music-panel-queue" aria-labelledby="music-tab-queue" data-panel="queue" hidden>
          <p class="music__note" data-queue-owner hidden></p>
          <p class="music__note" data-queue-text></p>
          <ul class="music-items" data-queue-items></ul>
          <button class="button music__more" type="button" data-more hidden>More</button>
        </div>
      </section>
    </div>
  </main>

  <dialog class="sheet" id="speaker-sheet" aria-labelledby="speaker-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="speaker-sheet-title">Choose a speaker</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <ul class="rooms rooms--sheet music-speakers" data-sheet-speakers></ul>
    </div>
  </dialog>

  <dialog class="sheet" id="item-sheet" aria-labelledby="item-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title music-sheet__title" id="item-sheet-title" data-item-name></h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <p class="music__note music-sheet__line" data-item-line></p>
      <div class="music-actions" data-item-actions></div>
      <p class="music__note" data-item-target></p>
    </div>
  </dialog>

  <dialog class="sheet" id="group-sheet" aria-labelledby="group-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title music-sheet__title" id="group-sheet-title" data-group-title>Group</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <p class="music__note">Speakers you add play what the group plays.</p>
      <h3 class="panel__title music-sheet__heading" data-members-title hidden>In the group</h3>
      <ul class="music-members" data-members></ul>
      <h3 class="panel__title music-sheet__heading">Add</h3>
      <ul class="music-members" data-candidates></ul>
      <button class="button music-sheet__join" type="button" data-join disabled>Join</button>
      <div class="music-result" role="status" data-group-result hidden></div>
      <button class="button music-sheet__end" type="button" data-group-end hidden>Ungroup all</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">The Music page needs JavaScript.</p></noscript>
</body>
</html>
