<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>thermite · Audio</title>
  <meta name="description" content="thermite: the house's speakers and streamers, what each plays and how it sounds.">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="thermite">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#120e0c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="remote.css">
  <link rel="stylesheet" href="audio.css">
  <link rel="stylesheet" href="shell.css">
  <script src="navigation.js"></script><script src="appearance.js"></script><script src="access-config.js"></script><script src="access.js"></script>
  <script src="house.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="backend.js" defer></script>
  <script src="audio-session.js" defer></script>
  <script src="audio.js" defer></script>
</head>
<body class="audio-page" data-thermite-page="audio">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 13.5 4.5 9 9 4.5"/><path d="M4.5 9h10a5 5 0 0 1 0 10H11"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 6.9a7.5 7.5 0 1 0 10.8 0"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="3.2"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path d="M18 6.5v11l-8.5-5.5z" fill="currentColor"/><path d="M6.5 6.5v11"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.5v11l8.5-5.5z" fill="currentColor"/><path d="M17.5 6.5v11"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
  </svg>

  <main class="audio" aria-labelledby="audio-title">
    <header class="audio__head">
      <a class="audio__back" href="./">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-back"></use></svg>
        <span>Remotes</span>
      </a>
      <h1 class="audio__title" id="audio-title">Audio</h1>
    </header>

    <p class="audio__mock" data-mock hidden>Demo · a sample house. No commands are sent.</p>

    <div class="targets-wrap" data-picker hidden>
      <div class="targets" role="group" aria-label="Audio devices" data-devices></div>
    </div>

    <p class="alert audio__alert" data-alert hidden>
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-warn"></use></svg>
      <span data-alert-text></span>
    </p>

    <section class="audio__device" data-device aria-labelledby="audio-device-name" hidden>
      <h2 class="sr-only" id="audio-device-name" data-device-name></h2>
      <!-- A locked room that owns the device disables every control here; the gateway refuses them anyway. -->
      <fieldset class="audio__controls" data-controls>
        <legend class="sr-only">Controls</legend>
        <div class="now-card" data-now>
          <p class="now-card__place"><span data-place></span><span class="now-card__model" data-model></span></p>
          <p class="now-card__title" data-title></p>
          <p class="now-card__line" data-line></p>
          <p class="now-card__badges" data-badges></p>
          <div class="now-card__transport" role="group" aria-label="Playback" data-transport></div>
        </div>

        <div class="audio__volume">
          <div class="fader">
            <div class="fader__bar">
              <button class="fader__step" type="button" data-volume-step="-1" aria-label="Volume down">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"></use></svg>
              </button>
              <input class="fader__input" type="range" min="0" max="100" step="1" value="0" aria-label="Volume" data-volume>
              <button class="fader__step" type="button" data-volume-step="1" aria-label="Volume up">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
              </button>
            </div>
          </div>
          <button class="key key--sm key--toggle audio__mute" type="button" aria-pressed="false" aria-label="Mute" data-mute hidden>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mute"></use></svg>
          </button>
          <button class="key key--sm key--toggle audio__power" type="button" aria-pressed="false" aria-label="Power" data-power hidden>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-power"></use></svg>
          </button>
        </div>
        <p class="audio__level" data-volume-text aria-hidden="true"></p>

        <div class="audio__inputs" data-inputs-wrap hidden>
          <h3 class="audio__section-title" id="audio-input-title">Input</h3>
          <div class="segmented segmented--scroll" role="radiogroup" aria-labelledby="audio-input-title" data-inputs></div>
        </div>

        <div data-sections></div>
      </fieldset>

      <details class="audio__facts" data-facts-wrap hidden>
        <summary>About this device <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-down"></use></svg></summary>
        <dl class="audio__fact-list" data-facts></dl>
      </details>
    </section>

    <div class="audio__empty" data-empty hidden>
      <p>No speaker or streamer here has an audio page yet.</p>
      <p>A WiiM or Sonos device under <code>control</code> in the house file gets one after <code>thermite generate</code>.</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">The Audio page needs JavaScript.</p></noscript>
</body>
</html>
