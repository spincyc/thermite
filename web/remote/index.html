<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remotes · thermite</title>
  <meta name="description" content="thermite: rooms, sources and the room's devices.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#120e0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="thermite">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="remote.css">
  <link rel="stylesheet" href="shell.css">
  <script src="appearance.js"></script><script src="access.js"></script>
  <script src="house.js" defer></script>
  <script src="shell.js" defer></script>
  <script src="remotes.js" defer></script>
  <script src="activity.js" defer></script>
  <script src="diagnostics.js" defer></script>
  <script src="backend.js" defer></script>
  <script src="session.js" defer></script>
  <script src="log.js" defer></script>
  <script src="remote.js" defer></script>
</head>
<body data-thermite-page="remotes">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 6.9a7.5 7.5 0 1 0 10.8 0"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6.5 14.5 5.5-5.5 5.5 5.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6.5-5.5 5.5 5.5 5.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 13.5 4.5 9 9 4.5"/><path d="M4.5 9h10a5 5 0 0 1 0 10H11"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></symbol>
    <symbol id="i-input" viewBox="0 0 24 24"><path d="M10 5h8.5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H10"/><path d="M3.5 12h10M10.5 8.5 14 12l-3.5 3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="M12 5 5 13h14z" fill="currentColor"/><path d="M5 18h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12" stroke-width="3.2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path d="M18 6.5v11l-8.5-5.5z" fill="currentColor"/><path d="M6.5 6.5v11"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.5v11l8.5-5.5z" fill="currentColor"/><path d="M17.5 6.5v11"/></symbol>
    <symbol id="i-play-pause" viewBox="0 0 24 24"><path d="M3.5 6.5v11l8-5.5z" fill="currentColor"/><path d="M15.5 6.5v11M20 6.5v11"/></symbol>
    <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M11.5 6.5v11l-8-5.5zM20.5 6.5v11l-8-5.5z" fill="currentColor"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M3.5 6.5v11l8-5.5zM12.5 6.5v11l8-5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16v4"/></symbol>
    <symbol id="i-streamer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="m10.5 7.5 4 2.5-4 2.5z" fill="currentColor"/><path d="M8.5 20h7"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.5a6.5 6.5 0 0 0-6.5 6.5"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7.5 7.5h9a4.5 4.5 0 0 1 4.5 4.5v2.5a2.5 2.5 0 0 1-4.6 1.4L15 14h-6l-1.4 1.9A2.5 2.5 0 0 1 3 14.5V12a4.5 4.5 0 0 1 4.5-4.5z"/><path d="M8 9.8v3.4M6.3 11.5h3.4"/><circle cx="15.5" cy="10.8" r="1" fill="currentColor"/><circle cx="17.5" cy="12.6" r="1" fill="currentColor"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20h7"/><path d="m4 2.5 16 16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.3v.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11"/></symbol>
  </svg>

  <div class="app">
    <aside class="panel panel--rooms" aria-label="Rooms">
      <section class="panel__section">
        <h2 class="panel__title">Rooms</h2>
        <ul class="rooms" data-room-list></ul>
        <button class="button button--all-off" type="button" data-action="all-off" title="Turns off every room and every device thermite controls">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-power"></use></svg>
          <span data-all-off-text>All off</span>
        </button>
        <a class="link link--pair" href="cameras.html">Cameras</a>
        <a class="link link--pair" href="topology.html">Site topology</a>
        <a class="link link--pair" href="pair.html">Pair TVs and streamers</a>
      </section>
    </aside>

    <main class="remote" id="remote" aria-label="Remote control">
      <header class="remote__top">
        <span class="torch remote__torch"><img src="mark.svg" width="44" height="35" alt="thermite"></span>
        <button class="room-switch" id="room-switch" type="button" aria-haspopup="dialog" aria-controls="room-sheet">
          <span class="room-switch__name"><span data-room-name>Loading</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-down"></use></svg></span>
        </button>
        <button class="icon-button" id="info-open" type="button" aria-haspopup="dialog" aria-controls="info-sheet" aria-label="Room devices, signal and audio">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-info"></use></svg>
        </button>
        <button class="icon-button log-toggle" id="log-toggle" type="button" aria-expanded="false" aria-controls="activity-log" aria-label="Show log" aria-keyshortcuts="L" title="Show log (L)">Log</button>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to light theme">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sun"></use></svg>
        </button>
      </header>

      <div class="targets-wrap">
        <!-- The arrows are for a mouse: a keyboard reaches each bubble with Tab, a finger swipes. -->
        <button class="targets__more" type="button" data-action="scroll-targets" data-step="-1" tabindex="-1" aria-hidden="true">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-left"></use></svg>
        </button>
        <div class="targets" role="tablist" aria-label="Sources and remotes" data-targets></div>
        <button class="targets__more" type="button" data-action="scroll-targets" data-step="1" tabindex="-1" aria-hidden="true">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-right"></use></svg>
        </button>
      </div>
      <p class="alert" id="alert" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-warn"></use></svg>
        <span id="alert-text"></span>
      </p>

      <section class="controls" id="controls" role="tabpanel" aria-label="Buttons">
        <div class="layout" data-layout></div>
        <p class="caption caption--source" data-caption="source"></p>

        <div class="lower" data-lower>
          <div class="rocker-wrap rocker-wrap--volume">
            <div class="rocker" role="group" aria-label="Volume">
              <button class="rocker__half rocker__half--up" type="button" data-button="volume_up" data-repeat aria-label="Volume up">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
              </button>
              <span class="rocker__label" aria-hidden="true">VOL</span>
              <button class="rocker__half rocker__half--down" type="button" data-button="volume_down" data-repeat aria-label="Volume down">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"></use></svg>
              </button>
            </div>
            <p class="caption caption--small" data-caption="audio"></p>
          </div>

          <div class="fader" data-fader hidden>
            <div class="fader__bar">
              <button class="fader__step" type="button" data-button="volume_down" data-repeat aria-label="Volume down">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"></use></svg>
              </button>
              <input class="fader__input" type="range" min="0" max="100" step="1" value="0" aria-label="Volume" data-fader-input>
              <button class="fader__step" type="button" data-button="volume_up" data-repeat aria-label="Volume up">
                <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
              </button>
            </div>
            <p class="caption" data-caption="fader"></p>
          </div>

          <button class="key key--mute" type="button" data-button="mute" aria-label="Mute">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-mute"></use></svg>
          </button>

          <div class="transport" role="group" aria-label="Playback" data-playback></div>
          <div class="lower__side" data-side></div>
        </div>
      </section>

      <p class="remote__mark" aria-hidden="true">thermite</p>
    </main>

    <div class="sidebar">
      <aside class="panel panel--info" aria-label="Room devices">
        <div class="info" data-info></div>
      </aside>
      <aside class="panel panel--signal" aria-label="Signal and audio">
        <section class="signal" data-signal="inline" tabindex="0" aria-label="Signal and audio information"></section>
      </aside>
    </div>

    <section class="activity-log" id="activity-log" aria-labelledby="activity-log-title" hidden>
      <h2 class="panel__title" id="activity-log-title">Log</h2>
      <p class="activity-log__empty" data-log-empty>Live commands, state changes and device problems from every room appear here.</p>
      <!-- Existing toast/announcement regions speak; this history must not repeat them. -->
      <ol class="activity-log__history" data-log-history role="log" aria-live="off" aria-label="Action and status history" tabindex="0"></ol>
    </section>

    <ul class="shortcuts" data-shortcuts aria-label="Keyboard shortcuts"></ul>
  </div>

  <dialog class="sheet" id="room-sheet" aria-labelledby="room-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="room-sheet-title">Choose a room</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <ul class="rooms rooms--sheet" data-room-list></ul>
      <button class="button button--all-off" type="button" data-action="all-off" title="Turns off every room and every device thermite controls">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-power"></use></svg>
        <span data-all-off-text>All off</span>
      </button>
      <a class="link link--pair" href="cameras.html">Cameras</a>
      <a class="link link--pair" href="topology.html">Site topology</a>
      <a class="link link--pair" href="pair.html">Pair TVs and streamers</a>
    </div>
  </dialog>

  <dialog class="sheet" id="info-sheet" aria-labelledby="info-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="info-sheet-title"><span data-room-name></span></h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="info" data-info></div>
    </div>
  </dialog>

  <dialog class="sheet" id="input-sheet" aria-labelledby="input-sheet-title">
    <div class="sheet__inner">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__head">
        <h2 class="sheet__title" id="input-sheet-title">Input</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
        </button>
      </header>
      <ul class="rooms rooms--sheet" data-input-list></ul>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <noscript><p class="noscript">The remote needs JavaScript.</p></noscript>
</body>
</html>
